name: X64软路由-UEFI

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: v25.12.2
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 查看
      uses: actions/checkout@main
      
    - name: 设置变量
      run: |
        sudo timedatectl set-timezone "$TZ"
        echo "status=success" >> ${GITHUB_OUTPUT}
      
    - name: 检查服务器性能
      run: |
        echo -e "\e[1;32m警告⚠\e[0m"
        echo -e "\e[1;32m分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！\e[0m"
        echo -e "\e[1;32m已知CPU型号（降序）：9V74，7763，8370C，8272CL，8171M，E5-2673 \n\e[0m"
        echo -e "--------------------------\e[1;32mCPU信息\e[0m--------------------------"
        echo -e "\e[1;32mCPU物理数量：\e[0m$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "\e[1;32mCPU型号:\e[0m $(cat /proc/cpuinfo | grep "model name" | head -1 | cut -d: -f2) \n"
        echo -e "\e[1;32mCPU核心:\e[0m $(nproc) 线程 \n"
        echo -e "--------------------------\e[1;32m内存信息\e[0m--------------------------"
        echo -e "\e[1;32m已安装内存详细信息\e[0m"
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo -e "--------------------------\e[1;32m硬盘信息\e[0m--------------------------"
        echo -e "\e[1;32m硬盘数量：\e[0m$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT
        echo -e "--------------------------\e[1;32m操作系统\e[0m--------------------------"
        echo -e "\e[1;32m系统版本:\e[0m"
        [ -f /etc/os-release ] && cat /etc/os-release | grep PRETTY_NAME | cut -d '"' -f 2 || lsb_release -d
        echo -e "\e[1;32m内核版本:\e[0m"
        uname -smr
        
    - name: 释放磁盘空间
      uses: sbwml/actions@free-disk
      with:
        build-mount-path: /mnt/workdir
        
    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo mkdir -p /mnt/workdir
        sudo chown $USER:$(id -gn) /mnt/workdir
        
    - name: 安装 Go 1.27.3
      env:
        GO_VERSION: '1.27.3'
      run: |
        set -e

        GO_ARCH="$(dpkg --print-architecture)"
        case "$GO_ARCH" in
          amd64) GO_ARCH="amd64" ;;
          arm64) GO_ARCH="arm64" ;;
          *)
            echo "不支持的 Runner 架构: $GO_ARCH"
            exit 1
            ;;
        esac

        GO_FILE="go${GO_VERSION}.linux-${GO_ARCH}.tar.gz"
        GO_URL="https://go.dev/dl/${GO_FILE}"

        if [ "$GO_ARCH" = "amd64" ]; then
          GO_SHA256="65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"
        else
          GO_SHA256="a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49"
        fi

        curl -fL --retry 3 "$GO_URL" -o "/tmp/${GO_FILE}"
        echo "${GO_SHA256}  /tmp/${GO_FILE}" | sha256sum -c -

        sudo rm -rf /usr/local/go
        sudo tar -C /usr/local -xzf "/tmp/${GO_FILE}"

        echo "/usr/local/go/bin" >> "$GITHUB_PATH"
        echo "GOROOT=/usr/local/go" >> "$GITHUB_ENV"
        echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

        export PATH="/usr/local/go/bin:$PATH"
        go version
        go env GOTOOLCHAIN
        test "$(go env GOVERSION)" = "go${GO_VERSION}"

    - name: 克隆源代码
      working-directory: /mnt/workdir
      run: |
        pwd
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义 feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        ls -al
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a
      
    - name: 删除不需要的 feeds 软件包
      run: |
        cd openwrt
        rm -rf feeds/luci/applications/luci-app-{appfilter,rtp2httpd,tailscale-community}
        rm -rf feeds/luci.tmp/info/{.packageinfo-applications_luci-app-appfilter,.packageinfo-applications_luci-app-rtp2httpd,.packageinfo-applications_luci-app-tailscale-community}
        sed -i '/^Source-Makefile:.*luci-app-appfilter/,/^@@/d; /^Package: luci-i18n-appfilter-*/,/^@@/d; /^Source-Makefile:.*luci-app-rtp2httpd/,/^@@/d; /^Package: luci-i18n-rtp2httpd-*/,/^@@/d; /^Source-Makefile:.*luci-app-tailscale-community/,/^@@/d; /^Package: luci-i18n-tailscale-community-*/,/^@@/d' feeds/luci.tmp/.packageinfo
        sed -i '/^$/N;/^\n$/D' feeds/luci.tmp/.packageinfo
        rm -rf feeds/packages/net/{chinadns-ng,dns2socks,geoview,hysteria,ipt2socks,microsocks,naiveproxy,open-app-filter,rtp2httpd,shadow-tls,shadowsocks-rust,shadowsocksr-libev,simple-obfs,sing-box,tcping,v2ray-geodata,v2ray-plugin,xray-core,xray-plugin}
        rm -rf feeds/packages.tmp/info/{.packageinfo-net_chinadns-ng,.packageinfo-net_dns2socks,.packageinfo-net_geoview,.packageinfo-net_hysteria,.packageinfo-net_ipt2socks,.packageinfo-net_microsocks,.packageinfo-net_naiveproxy,.packageinfo-net_open-app-filter,.packageinfo-net_rtp2httpd,.packageinfo-net_shadow-tls,.packageinfo-net_shadowsocks-rust,.packageinfo-net_shadowsocksr-libev,.packageinfo-net_simple-obfs,.packageinfo-net_sing-box,.packageinfo-net_tcping,.packageinfo-net_v2ray-geodata,.packageinfo-net_v2ray-plugin,.packageinfo-net_xray-core,.packageinfo-net_xray-plugin}
        sed -i '/^Source-Makefile: feeds\/packages\/net\/chinadns-ng\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/dns2socks\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/geoview\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/hysteria\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/ipt2socks\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/microsocks\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/naiveproxy\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/open-app-filter\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/rtp2httpd\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/shadow-tls\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/shadowsocks-rust\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/shadowsocksr-libev\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/simple-obfs\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/sing-box\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/tcping\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/v2ray-geodata\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/v2ray-plugin\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/xray-core\/Makefile/,/^@@/d; /^Source-Makefile: feeds\/packages\/net\/xray-plugin\/Makefile/,/^@@/d; /^Package: chinadns-ng/,/^@@/d; /^Package: dns2socks/,/^@@/d; /^Package: geoview/,/^@@/d; /^Package: hysteria/,/^@@/d; /^Package: ipt2socks/,/^@@/d; /^Package: microsocks/,/^@@/d; /^Package: naiveproxy/,/^@@/d; /^Package: appfilter/,/^@@/d; /^Package: rtp2httpd/,/^@@/d; /^Package: shadow-tls/,/^@@/d; /^Package: shadowsocks-rust/,/^@@/d; /^Package: shadowsocksr-libev/,/^@@/d; /^Package: simple-obfs/,/^@@/d; /^Package: sing-box/,/^@@/d; /^Package: tcping/,/^@@/d; /^Package: v2ray-geodata/,/^@@/d; /^Package: v2ray-plugin/,/^@@/d; /^Package: xray-core/,/^@@/d; /^Package: xray-plugin/,/^@@/d' feeds/packages.tmp/.packageinfo
        sed -i '/^$/N;/^\n$/D' feeds/packages.tmp/.packageinfo
    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a
      
    - name: SSH 连接到 Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: 加载自定义配置
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载 package 
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 检查空间使用情况
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成发布标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ ${UPLOAD_GOFILE} = true && ${{ steps.gofile.outputs.url }} ] && echo "🔗 [GoFile](${{ steps.gofile.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件并发布
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
